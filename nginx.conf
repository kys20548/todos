# jump 上的 gitea-proxy 用：把外網進來的 3000 / 222 轉發到 devbox（10.140.0.29）的 Gitea。
events {}

# 網頁：HTTP 反向代理
http {
  server {
    listen 3000;
    client_max_body_size 0;   # 不限制 HTTP push 大小

    location / {
      proxy_pass http://10.140.0.29:3000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

# git SSH：純 TCP 轉發（要用 stream，不能放在 http 裡）
stream {
  server {
    listen 222;
    proxy_pass 10.140.0.29:222;
  }
}
