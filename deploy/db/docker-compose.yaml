# devbox（內網機）上的部署檔：資料庫 + Gitea（內部 git 伺服器，用內建 SQLite）。
# 在這個目錄放 .env（範本見 ../../.env.example）後：docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: todoapp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-todoapp}
    ports:
      # 只綁內網 IP，jump 才連得到；不綁 0.0.0.0，避免暴露到其他網卡 也不能寫localhost 127.0.0.1等 別的機器連不到
      - "${DB_BIND_IP:-10.140.0.29}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  gitea:
    image: gitea/gitea:1.22
    container_name: gitea
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      # 不設定就是 sqlite3，這裡明寫出來，資料庫檔在 /data/gitea/gitea.db
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:-10.140.0.29}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-http://localhost:3000/}
      GITEA__server__SSH_DOMAIN: ${GITEA_DOMAIN:-10.140.0.29}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-222}
    ports:
      # 不指定 IP（等同 0.0.0.0），本機才連得到；容器內 sshd 是 22，host 用 222，避免跟 devbox 自己的 sshd 衝突
      - "3000:3000"
      - "${GITEA_SSH_PORT:-222}:22"
    volumes:
      - gitea_data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/3000"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  gitea_data:
