# jump（跳板機）上的部署檔：只放 migrate / serve / worker 三個執行單位。
# 資料庫在 devbox（內網機），見 deploy/db/docker-compose.yaml；
# 本機一次起完整環境（含 db）請用 docker-compose.local.yaml。
#
# 三個單位共用同一個 image，靠 command 區分（image 的 ENTRYPOINT 是 ./todoapp）。
x-app: &app
  image: todoapp:1.0
  environment:
    APP_ENV: ${APP_ENV:-prod}
    # 必填，寫在 .env（不進 git，範本見 .env.example）。
    # 跨機器連線不能用 service 名稱，要寫 devbox 的內網 IP。
    DB_SOURCE: ${DB_SOURCE:?DB_SOURCE is required, see .env.example}

services:
  # 一次性：跑完就退出，restart "no"。schema 變更與 server 啟動是兩件事，
  # 重啟 serve 不會重跑 migration；有新 migration 時：
  #   docker compose run --rm migrate
  # 或第一次部署時 docker compose up -d 會先跑它一次。
  migrate:
    <<: *app
    command: ["migrate", "up"]
    restart: "no"

  serve:
    <<: *app
    command: ["serve", "--port", "8080"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/todos-summary"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  worker:
    <<: *app
    command: ["worker", "event"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
