services:
  postgres:
    image: postgres:16-alpine
    container_name: todoapp_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-todoapp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d todoapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: todoapp-app:latest
    container_name: todoapp_server
    # image 裡的 CMD 是 ./main，不會自動跑 migration——schema 變更跟啟動
    # server 是兩件事，第一次啟動或有新 migration 時手動下：
    #   docker compose run --rm app ./migrate up
    #
    # 掛進去的 app.env 蓋過 image 裡烤好的那份：同目錄下換一份 app.env，
    # 不用重新 build image 就能吃到正式環境的設定
    volumes:
      - ./app.env:/app/app.env:ro
    # DB_SOURCE 另外用環境變數蓋，不寫在 app.env 裡：容器對容器要用 service
    # 名稱 postgres，不是 localhost，而且密碼不該跟著 app.env 一起放在部署目錄明文管理
    environment:
      DB_SOURCE: ${DB_SOURCE:-postgresql://root:secret@postgres:5432/todoapp?sslmode=disable}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    container_name: todoapp_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@todoapp.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # 預先註冊好連線設定（host/port/db），少打開一次就要重輸一次的麻煩；
      # 密碼不放進去，連線時還是要手動輸入 postgres 密碼
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
